spring:
  docker:
    compose:
      enabled: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui
    urls-primary-name: web
    urls:
      - name: app
        url: /v3/api-docs/app
      - name: common
        url: /v3/api-docs/common
      - name: web
        url: /v3/api-docs/web

seed:
  admin:
    enabled: ${SEED_ADMIN_ENABLED:true}
    username: ${SEED_ADMIN_USERNAME:admin}
    email: ${SEED_ADMIN_EMAIL:admin@local}
    password: ${SEED_ADMIN_PASSWORD:admin1234!}
  dev-data:
    enabled: ${SEED_DEV_DATA_ENABLED:true}
    user-password: ${SEED_DEV_USER_PASSWORD:pingdom1234!}

fcm:
  enabled: false
  key-path: /app/fcm-key.json
