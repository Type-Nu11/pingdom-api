spring:
  application:
    name: Pingdom
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL}
    driver-class-name: ${DB_DRIVER_CLASS_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS}

postmark:
  # Postmark 서버 토큰 설정
  server-token: ${POSTMARK_SERVER_TOKEN}
  # 인증 메일 발신자 주소 설정
  from-email: ${MAIL_FROM}
  # 인증 메일 링크 기본 URL 설정
  verification-base-url: ${MAIL_VERIFICATION_BASE_URL}
