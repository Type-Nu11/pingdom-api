server:
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # 직접 연결된 프록시만 forwarded header를 해석한다. 운영 프록시 대역은 정규식으로 명시해야 한다.
      internal-proxies: '${TRUSTED_PROXY_IPS_REGEX:127\.0\.0\.1|::1}'
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto

analysis:
  ai:
    provider: ${AI_PROVIDER:gemini}
    base-url: ${AI_BASE_URL:}
    model: ${AI_MODEL:}
    api-key: ${GEMINI_API_KEY:${AI_API_KEY:}}
    connect-timeout: ${AI_CONNECT_TIMEOUT:2s}
    read-timeout: ${AI_READ_TIMEOUT:2m}
  mcp:
    server-url: ${MCP_SERVER_URL:http://localhost:8081/mcp}
    connect-timeout: ${MCP_CONNECT_TIMEOUT:2s}
    read-timeout: ${MCP_READ_TIMEOUT:30s}
spring:
  application:
    name: Pingdom
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pingdom}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}
    username: ${DB_USERNAME:pingdom}
    password: ${DB_PASSWORD:pingdom}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: 1
    validate-on-migrate: true
    postgresql:
      transactional-lock: ${FLYWAY_POSTGRESQL_TRANSACTIONAL_LOCK:false}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cloud:
    aws:
      s3:
        bucket: ${AWS_S3_BUCKET}
        public-base-url: ${AWS_S3_PUBLIC_BASE_URL:}
      region:
        static: ${AWS_REGION}
      stack:
        auto: false
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
  config:
    import: optional:file:.env[.properties]
#로컬용 컴포즈 설정
  docker:
    compose:
      file: docker-compose-local.yml
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:}}
            redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}
            scope:
              - openid
              - profile
              - email

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS}

merchant:
  verification:
    encryption-key: ${MERCHANT_VERIFICATION_ENCRYPTION_KEY}

auth:
  refresh-cookie:
    name: ${AUTH_REFRESH_COOKIE_NAME:PINGDOM_REFRESH_TOKEN}
    secure: ${AUTH_REFRESH_COOKIE_SECURE:true}
    same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
    domain: ${AUTH_REFRESH_COOKIE_DOMAIN:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://pingdom-admin.vercel.app}

postmark:
  server-token: ${POSTMARK_SERVER_TOKEN}
  from-email: ${POSTMARK_FROM_EMAIL}
  verification-base-url: ${MAIL_VERIFICATION_BASE_URL}
  password-reset-base-url: ${MAIL_PASSWORD_RESET_BASE_URL:http://localhost:8080/auth/password-reset/confirm}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

logging:
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}

fcm:
  key-path: src/main/resources/fcm-key.json

outbox:
  enabled: true
  batch-size: 20
  worker-concurrency: 4
  worker-queue-capacity: 40
  cleanup-batch-size: 500
  max-attempts: 5
  base-backoff: PT10S
  max-backoff: PT10M
  processing-timeout: PT5M
  retention: P7D
  poll-delay: PT5S
  initial-delay: PT5S
  cleanup-delay: PT10M
  cleanup-initial-delay: PT1H

user:
  withdrawal:
    retention: P30D
    cleanup-batch-size: 100
    max-cleanup-batches: 10
    cleanup-delay: PT24H
    cleanup-initial-delay: PT1H

travel:
  data-retention:
    withdrawn-user-retention: P7D
    cleanup-batch-size: 100
    cleanup-enabled: true
    cleanup-delay: PT1H
    cleanup-initial-delay: PT1H

abuse:
  rate-limit:
    storage: ${ABUSE_RATE_LIMIT_STORAGE:redis}
    redis-key-prefix: ${REDIS_RATE_LIMIT_KEY_PREFIX:pingdom:rate-limit:}
    fail-open: ${REDIS_RATE_LIMIT_FAIL_OPEN:false}
    signup-email:
      limit: 3
      window: PT1H
    signup-ip:
      limit: 30
      window: PT1H
    login-username:
      limit: 5
      window: PT1M
    login-ip:
      limit: 120
      window: PT1M
    token-refresh-token:
      limit: 10
      window: PT1M
    token-refresh-ip:
      limit: 240
      window: PT1M
    email-resend:
      minimum-interval: PT1M
      email-daily:
        limit: 5
        window: P1D
      ip-daily:
        limit: 100
        window: P1D
    email-verify-email:
      limit: 5
      window: PT10M
    email-verify-ip:
      limit: 120
      window: PT10M
    password-reset-request:
      minimum-interval: PT1M
      email-daily:
        limit: 5
        window: P1D
      ip-daily:
        limit: 100
        window: P1D
    password-reset-confirm-token:
      limit: 5
      window: PT1M
    password-reset-confirm-ip:
      limit: 120
      window: PT1M
    report-user:
      limit: 10
      window: PT1H
    report-ip:
      limit: 200
      window: PT1H
    map-image-like-user:
      limit: 60
      window: PT1M
    map-image-like-ip:
      limit: 600
      window: PT1M
    recommendation-click-user:
      limit: 120
      window: PT1M
    recommendation-click-ip:
      limit: 1000
      window: PT1M
    image-upload-user:
      limit: 10
      window: PT1H
    image-upload-ip:
      limit: 100
      window: PT1H
    consultation-intro-ip:
      limit: 10
      window: PT1M

gemini:
  enabled: ${GEMINI_ENABLED:false}
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
  connect-timeout: ${GEMINI_CONNECT_TIMEOUT:PT2S}
  read-timeout: ${GEMINI_READ_TIMEOUT:PT5S}

place:
  recommendation:
    verified-boost:
      score: ${VERIFIED_BOOST_SCORE:0.08}
    default-version: place-rec-v1
    versions:
      - version: place-rec-v1
        stage: STABLE
        traffic-percentage: 100
        feature-logging-enabled: false
        portfolio-size-multiplier: 4
        mmr-relevance-weight: 0.75
        interest-match-boost: 0.10
        intent-match-boost: 0.15
        benefit-boost: 0.05
        availability-boost: 0.05
        mix:
          personal-ratio: 0.35
          popular-ratio: 0.25
          fresh-ratio: 0.20
          geo-ratio: 0.20
        personalized-weights:
          geo-weight: 0.33
          personal-weight: 0.30
          quality-weight: 0.13
          engagement-weight: 0.07
          conversion-weight: 0.07
          freshness-weight: 0.08
          exploration-weight: 0.06
          trust-weight: 0.00
        anonymous-weights:
          geo-weight: 0.48
          personal-weight: 0.00
          quality-weight: 0.16
          engagement-weight: 0.10
          conversion-weight: 0.08
          freshness-weight: 0.12
          exploration-weight: 0.09
          trust-weight: 0.00
      - version: place-rec-v2
        stage: EXPERIMENTAL
        traffic-percentage: 0
        feature-logging-enabled: true
        portfolio-size-multiplier: 5
        mmr-relevance-weight: 0.70
        interest-match-boost: 0.00
        intent-match-boost: 0.00
        benefit-boost: 0.05
        availability-boost: 0.05
        mix:
          personal-ratio: 0.40
          popular-ratio: 0.20
          fresh-ratio: 0.25
          geo-ratio: 0.15
        personalized-weights:
          geo-weight: 0.25
          personal-weight: 0.29
          quality-weight: 0.10
          engagement-weight: 0.07
          conversion-weight: 0.08
          freshness-weight: 0.05
          exploration-weight: 0.06
          trust-weight: 0.10
        anonymous-weights:
          geo-weight: 0.36
          personal-weight: 0.00
          quality-weight: 0.13
          engagement-weight: 0.09
          conversion-weight: 0.09
          freshness-weight: 0.14
          exploration-weight: 0.09
          trust-weight: 0.10

verification:
  location-check-in:
    max-distance-meters: 100
    max-accuracy-meters: 50
    observation-ttl: PT5M
    future-tolerance: PT30S
  visit-evidence:
    retention: P30D
    max-file-size-bytes: 10485760
    cleanup-batch-size: 10
    cleanup-enabled: true
    cleanup-delay: PT24H
    cleanup-initial-delay: PT1H
