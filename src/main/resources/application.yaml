spring:
  application:
    name: Pingdom
  server:
    forward-headers-strategy: framework
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pingdom}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.postgresql.Driver}
    username: ${DB_USERNAME:pingdom}
    password: ${DB_PASSWORD:pingdom}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cloud:
    aws:
      s3:
        bucket: ${AWS_S3_BUCKET}
      region:
        static: ${AWS_REGION}
      stack:
        auto: false
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
  config:
    import: optional:file:.env[.properties]
#로컬용 컴포즈 설정
  docker:
    compose:
      file: docker-compose-local.yml
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:${GOOGLE_CLIENT_ID:}}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:}}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS}

postmark:
  server-token: ${POSTMARK_SERVER_TOKEN}
  from-email: ${MAIL_FROM}
  verification-base-url: ${MAIL_VERIFICATION_BASE_URL}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth2/redirect}

fcm:
  key-path: src/main/resources/fcm-key.json

place:
  recommendation:
    default-version: place-rec-v1
    versions:
      - version: place-rec-v1
        stage: STABLE
        traffic-percentage: 100
        feature-logging-enabled: false
        portfolio-size-multiplier: 4
        mmr-relevance-weight: 0.75
        mix:
          personal-ratio: 0.35
          popular-ratio: 0.25
          fresh-ratio: 0.20
          geo-ratio: 0.20
        personalized-weights:
          geo-weight: 0.33
          personal-weight: 0.30
          quality-weight: 0.13
          engagement-weight: 0.07
          conversion-weight: 0.07
          freshness-weight: 0.08
          exploration-weight: 0.06
        anonymous-weights:
          geo-weight: 0.48
          personal-weight: 0.00
          quality-weight: 0.16
          engagement-weight: 0.10
          conversion-weight: 0.08
          freshness-weight: 0.12
          exploration-weight: 0.09
      - version: place-rec-v2
        stage: EXPERIMENTAL
        traffic-percentage: 0
        feature-logging-enabled: true
        portfolio-size-multiplier: 5
        mmr-relevance-weight: 0.70
        mix:
          personal-ratio: 0.40
          popular-ratio: 0.20
          fresh-ratio: 0.25
          geo-ratio: 0.15
        personalized-weights:
          geo-weight: 0.28
          personal-weight: 0.32
          quality-weight: 0.11
          engagement-weight: 0.08
          conversion-weight: 0.09
          freshness-weight: 0.06
          exploration-weight: 0.06
        anonymous-weights:
          geo-weight: 0.40
          personal-weight: 0.00
          quality-weight: 0.14
          engagement-weight: 0.10
          conversion-weight: 0.10
          freshness-weight: 0.16
          exploration-weight: 0.10
