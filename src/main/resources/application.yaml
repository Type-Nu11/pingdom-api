spring:
  application:
    name: Pingdom
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL:jdbc:h2:mem:pingdom;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${DB_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  h2:
    console:
      enabled: true

jwt:
  secret: ${JWT_SECRET:01234567890123456789012345678901}
  access-token-expiration-seconds: ${JWT_ACCESS_TOKEN_EXPIRATION_SECONDS:3600}
  refresh-token-expiration-seconds: ${JWT_REFRESH_TOKEN_EXPIRATION_SECONDS:1209600}

postmark:
  # Postmark 서버 토큰 설정
  server-token: ${POSTMARK_SERVER_TOKEN:}
  # 인증 메일 발신자 주소 설정
  from-email: ${MAIL_FROM:no-reply@pingdom.local}
  # 인증 메일 링크 기본 URL 설정
  verification-base-url: ${MAIL_VERIFICATION_BASE_URL:http://localhost:8080/auth/email/verify}
