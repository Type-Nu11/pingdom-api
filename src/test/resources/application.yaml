spring:
  profiles:
    active: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false
  cloud:
    aws:
      s3:
        enabled: false
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret

jwt:
  secret: 01234567890123456789012345678901
  access-token-expiration-seconds: 3600
  refresh-token-expiration-seconds: 1209600

merchant:
  verification:
    encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

auth:
  refresh-cookie:
    name: PINGDOM_REFRESH_TOKEN
    secure: true
    same-site: Lax
    domain:

cors:
  allowed-origins: http://localhost:5173

postmark:
  server-token: test-postmark-token
  from-email: no-reply@pingdom.local
  verification-base-url: http://localhost:8080/auth/email/verify

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

fcm:
  enabled: false
  key-path: src/test/resources/firebase-test-key.json

seed:
  admin:
    enabled: false
  dev-data:
    enabled: false

abuse:
  rate-limit:
    fail-open: true

outbox:
  enabled: false
  batch-size: 20
  worker-concurrency: 2
  worker-queue-capacity: 20
  cleanup-batch-size: 100
  max-attempts: 5
  base-backoff: PT10S
  max-backoff: PT10M
  processing-timeout: PT5M
  retention: P7D
