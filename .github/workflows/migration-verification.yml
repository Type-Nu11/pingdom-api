name: Migration Verification

on:
  pull_request:
    branches:
      - release
      - develop
    paths:
      - 'src/main/resources/db/migration/**'
      - 'src/test/java/com/typenull/pingdom/integration/migration/**'
      - 'src/main/resources/application*.yaml'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/migration-verification.yml'
      - '.github/workflows/workflow.yml'

permissions:
  contents: read

env:
  TZ: UTC
  LANG: C.UTF-8

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Flyway migration verification
        run: ./gradlew --no-daemon --build-cache --configuration-cache migrationTest --tests com.typenull.pingdom.integration.migration.FlywayMigrationIntegrationTest

      - name: Verify Flyway migration test reports
        run: |
          test_report_count="$(find build/test-results/migrationTest -name 'TEST-*.xml' -type f | wc -l | tr -d ' ')"
          test "$test_report_count" -gt 0
          echo "Flyway migration test report files: $test_report_count"

      - name: Upload migration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            build/test-results/**
            build/reports/tests/**
            build/reports/problems/**
