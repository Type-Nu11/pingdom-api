name: Migration Verification

on:
  pull_request:
    branches:
      - release
      - develop
    paths:
      - 'src/main/resources/db/migration/**'
      - 'src/test/java/com/typenull/pingdom/migration/**'
      - 'src/main/resources/application*.yaml'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/migration-verification.yml'
      - '.github/workflows/workflow.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Flyway migration verification
        run: ./gradlew --no-daemon --build-cache --configuration-cache test --tests com.typenull.pingdom.migration.FlywayMigrationIntegrationTest
