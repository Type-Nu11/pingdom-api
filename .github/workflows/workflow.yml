name: Pingdom on AWS EC2

on:
  push:
    branches: [release, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches:
      - release
      - develop

permissions:
  contents: read

env:
  TZ: UTC
  LANG: C.UTF-8

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/release' }}

jobs:
  fast-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run fast test gate
        run: ./gradlew --no-daemon --build-cache --configuration-cache test

      - name: Verify fast test reports
        run: |
          test_report_count="$(find build/test-results/test -name 'TEST-*.xml' -type f | wc -l | tr -d ' ')"
          test "$test_report_count" -gt 0
          echo "Fast test report files: $test_report_count"

      - name: Upload fast test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-test-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            build/test-results/**
            build/reports/tests/**
            build/reports/problems/**

  postgres-integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run PostgreSQL integration smoke gate
        run: ./gradlew --no-daemon --build-cache --configuration-cache postgresSmokeTest

      - name: Verify PostgreSQL integration smoke reports
        run: |
          test_report_count="$(find build/test-results/postgresSmokeTest -name 'TEST-*.xml' -type f | wc -l | tr -d ' ')"
          test "$test_report_count" -gt 0
          echo "PostgreSQL integration smoke report files: $test_report_count"

      - name: Upload PostgreSQL integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-integration-test-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            build/test-results/**
            build/reports/tests/**
            build/reports/problems/**

  build:
    needs: [fast-test, postgres-integration-test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run release migration smoke gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        run: ./gradlew --no-daemon --build-cache --configuration-cache migrationSmokeTest

      - name: Verify release migration smoke reports
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        run: |
          test_report_count="$(find build/test-results/migrationSmokeTest -name 'TEST-*.xml' -type f | wc -l | tr -d ' ')"
          test "$test_report_count" -gt 0
          echo "Migration smoke report files: $test_report_count"

      - name: Build bootJar
        run: ./gradlew --no-daemon --build-cache --configuration-cache bootJar

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            build/test-results/**
            build/reports/tests/**
            build/reports/problems/**

      - name: Docker Hub login
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/release' # release 푸쉬일때만 이미지 푸쉬
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pingdom:latest
            ${{ secrets.DOCKER_USERNAME }}/pingdom:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            set -eu
            cd ~/Pingdom_Backend

            deployment_env="$HOME/.pingdom-deploy.env"
            if [ -f "$deployment_env" ]; then
              set -a
              . "$deployment_env"
              set +a
            fi

            previous_app_container_id="$(docker compose ps -q app 2>/dev/null || true)"
            previous_image=""
            if [ -n "$previous_app_container_id" ]; then
              previous_image="$(docker inspect --format='{{.Config.Image}}' "$previous_app_container_id")"
            fi

            git pull origin release

            expected_image="${{ secrets.DOCKER_USERNAME }}/pingdom:${{ github.sha }}"
            export PINGDOM_APP_IMAGE="$expected_image"

            persist_deployment_image() {
              umask 077
              printf 'PINGDOM_APP_IMAGE=%s\n' "$1" > "$deployment_env"
            }

            rollback_app() {
              if [ -z "$previous_image" ]; then
                echo "No previous app image is available for rollback."
                return 0
              fi

              echo "Rolling back app to $previous_image"
              export PINGDOM_APP_IMAGE="$previous_image"
              docker compose up -d --force-recreate app
              persist_deployment_image "$previous_image"
            }

            docker compose pull app
            if ! docker compose up -d --force-recreate app; then
              rollback_app
              exit 1
            fi

            app_container_id="$(docker compose ps -q app)"
            if [ -z "$app_container_id" ]; then
              echo "App container was not created."
              rollback_app
              exit 1
            fi

            running_image="$(docker inspect --format='{{.Config.Image}}' "$app_container_id")"
            if [ "$running_image" != "$expected_image" ]; then
              echo "Unexpected app image: $running_image"
              rollback_app
              exit 1
            fi

            readiness_endpoint="http://127.0.0.1:8080/actuator/health/readiness"
            attempt=1
            until curl --fail --silent --show-error "$readiness_endpoint"; do
              if [ "$attempt" -ge 37 ]; then
                echo "Readiness probe failed after $attempt attempts: $readiness_endpoint"
                docker compose ps
                docker compose logs --tail=100 app
                rollback_app
                exit 1
              fi

              attempt=$((attempt + 1))
              sleep 5
            done

            persist_deployment_image "$expected_image"
            docker image prune -f
