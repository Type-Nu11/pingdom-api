name: Pingdom on AWS EC2

on:
  push:
    branches: [release, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches:
      - release
      - develop

permissions:
  contents: read

env:
  TZ: UTC
  LANG: C.UTF-8

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/release' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile main and test sources
        run: ./gradlew --no-daemon --build-cache --configuration-cache compileJava compileTestJava

      - name: Run core test gate
        run: |
          ./gradlew --no-daemon --build-cache --configuration-cache test \
            --tests com.typenull.pingdom.auth.AuthControllerTest \
            --tests com.typenull.pingdom.admin.AdminSecurityTest \
            --tests com.typenull.pingdom.swagger.SwaggerSecurityTest

      - name: Run migration test gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        run: ./gradlew --no-daemon --build-cache --configuration-cache test --tests com.typenull.pingdom.migration.FlywayMigrationIntegrationTest

      - name: Build bootJar
        run: ./gradlew --no-daemon --build-cache --configuration-cache bootJar -x test

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            build/test-results/test/**
            build/reports/tests/test/**
            build/reports/problems/**

      - name: Docker Hub login
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/release' # release 푸쉬일때만 이미지 푸쉬
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pingdom:latest
            ${{ secrets.DOCKER_USERNAME }}/pingdom:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd ~/Pingdom_Backend
            git pull origin release
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f
