name: Pingdom on AWS EC2

on:
  push:
    branches: [release, develop]
  pull_request:
    branches:
      - release
      - develop

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar -x test

      - name: Docker Hub login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/release' # release 푸쉬일때만 이미지 푸쉬
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/pingdom:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/pingdom:${{ github.sha }} \
            .
          docker push ${{ secrets.DOCKER_USERNAME }}/pingdom:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/pingdom:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            cd ~/Pingdom_Backend
            git pull origin release
            docker compose pull
            docker compose up -d --force-recreate
            docker image prune -f