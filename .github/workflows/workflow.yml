name: Pingdom on AWS EC2

on:
  push:
    branches: [release, develop]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches:
      - release
      - develop

permissions:
  contents: read

env:
  TZ: UTC
  LANG: C.UTF-8

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/release' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compile main and test sources
        run: ./gradlew --no-daemon --build-cache --configuration-cache compileJava compileTestJava

      - name: Run core test gate
        run: |
          ./gradlew --no-daemon --build-cache --configuration-cache test \
            --tests com.typenull.pingdom.auth.AuthControllerTest \
            --tests com.typenull.pingdom.admin.AdminSecurityTest \
            --tests com.typenull.pingdom.swagger.SwaggerSecurityTest

      - name: Run migration test gate
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        run: ./gradlew --no-daemon --build-cache --configuration-cache test --tests com.typenull.pingdom.integration.migration.FlywayMigrationIntegrationTest

      - name: Build bootJar
        run: ./gradlew --no-daemon --build-cache --configuration-cache bootJar -x test

      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            build/test-results/test/**
            build/reports/tests/test/**
            build/reports/problems/**

      - name: Docker Hub login
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        if: github.event_name == 'push' && github.ref == 'refs/heads/release'
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/release' # release 푸쉬일때만 이미지 푸쉬
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/pingdom:latest
            ${{ secrets.DOCKER_USERNAME }}/pingdom:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            set -eu
            cd ~/Pingdom_Backend

            deployment_env="$HOME/.pingdom-deploy.env"
            if [ -f "$deployment_env" ]; then
              set -a
              . "$deployment_env"
              set +a
            fi

            previous_app_container_id="$(docker compose ps -q app 2>/dev/null || true)"
            previous_image=""
            if [ -n "$previous_app_container_id" ]; then
              previous_image="$(docker inspect --format='{{.Config.Image}}' "$previous_app_container_id")"
            fi

            git pull origin release

            expected_image="${{ secrets.DOCKER_USERNAME }}/pingdom:${{ github.sha }}"
            export PINGDOM_APP_IMAGE="$expected_image"

            persist_deployment_image() {
              umask 077
              printf 'PINGDOM_APP_IMAGE=%s\n' "$1" > "$deployment_env"
            }

            rollback_app() {
              if [ -z "$previous_image" ]; then
                echo "No previous app image is available for rollback."
                return 0
              fi

              echo "Rolling back app to $previous_image"
              export PINGDOM_APP_IMAGE="$previous_image"
              docker compose up -d --force-recreate app
              persist_deployment_image "$previous_image"
            }

            docker compose pull app
            if ! docker compose up -d --force-recreate app; then
              rollback_app
              exit 1
            fi

            app_container_id="$(docker compose ps -q app)"
            if [ -z "$app_container_id" ]; then
              echo "App container was not created."
              rollback_app
              exit 1
            fi

            running_image="$(docker inspect --format='{{.Config.Image}}' "$app_container_id")"
            if [ "$running_image" != "$expected_image" ]; then
              echo "Unexpected app image: $running_image"
              rollback_app
              exit 1
            fi

            attempt=1
            until curl --fail --silent --show-error http://127.0.0.1:8080/actuator/health/liveness; do
              if [ "$attempt" -ge 12 ]; then
                docker compose logs --tail=100 app
                rollback_app
                exit 1
              fi

              attempt=$((attempt + 1))
              sleep 5
            done

            persist_deployment_image "$expected_image"
            docker image prune -f
