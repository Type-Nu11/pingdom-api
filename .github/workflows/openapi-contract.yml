name: OpenAPI Contract Verification

on:
  pull_request:
    branches:
      - release
      - develop
    paths:
      - 'src/main/**'
      - 'src/test/java/com/typenull/pingdom/swagger/**'
      - 'src/main/resources/application*.yaml'
      - 'src/test/resources/openapi-baseline/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/openapi-contract.yml'

permissions:
  contents: read

env:
  TZ: UTC
  LANG: C.UTF-8

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-openapi-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify OpenAPI contract compatibility
        run: ./gradlew --no-daemon --build-cache verifyOpenApiContract

      - name: Upload OpenAPI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-diagnostics-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            build/test-results/test/**
            build/reports/tests/test/**
            build/reports/problems/**
