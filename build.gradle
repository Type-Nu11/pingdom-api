plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.typenull'
version = '0.0.1-SNAPSHOT'
description = 'Pingdom'

ext['testcontainers.version'] = '1.21.4'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

configurations {
    openapiDiffCli
}

//플레인 jar 안생기게
jar {
    enabled = false
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.hibernate.orm:hibernate-spatial'
    implementation 'org.locationtech.jts:jts-core'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
    implementation 'com.postmarkapp:postmark:1.13.0'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3:3.3.0'
    implementation 'com.google.firebase:firebase-admin:9.3.0'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    openapiDiffCli 'org.openapitools.openapidiff:openapi-diff-cli:2.1.0:all@jar'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat = 'full'
    }
}

def openApiOutputDir = layout.buildDirectory.dir('openapi')
def openApiBaselineDir = layout.projectDirectory.dir('src/test/resources/openapi-baseline')
def openApiDiffOutputDir = layout.buildDirectory.dir('reports/openapi-diff')
def openApiSpecs = ['openapi.json', 'app.json', 'common.json', 'consulting.json', 'web.json']

tasks.register('exportOpenApiSpecs', JavaExec) {
    group = 'documentation'
    description = 'Exports OpenAPI JSON specs to build/openapi.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.typenull.pingdom.integration.swagger.OpenApiSpecExporter'
    outputs.dir(openApiOutputDir)
    argumentProviders.add({
        [
                '--openapi.output-dir=' + openApiOutputDir.get().asFile.absolutePath
        ]
    } as CommandLineArgumentProvider)
}

def verifyOpenApiContractTasks = openApiSpecs.collect { specName ->
    def taskName = "verifyOpenApiContract${specName.replace('.json', '').capitalize()}"
    tasks.register(taskName, JavaExec) {
        group = 'verification'
        description = "Verifies ${specName} against the committed OpenAPI baseline."
        dependsOn tasks.named('exportOpenApiSpecs')
        classpath = configurations.openapiDiffCli
        mainClass = 'org.openapitools.openapidiff.cli.Main'

        def baselineSpec = openApiBaselineDir.file(specName)
        def generatedSpec = openApiOutputDir.map { it.file(specName) }
        def diffJson = openApiDiffOutputDir.map { it.file(specName.replace('.json', '-diff.json')) }

        inputs.file(baselineSpec)
        inputs.file(generatedSpec)
        outputs.file(diffJson)

        doFirst {
            def baselineFile = baselineSpec.asFile
            def generatedFile = generatedSpec.get().asFile
            if (!baselineFile.exists()) {
                throw new GradleException("OpenAPI baseline spec is missing: ${baselineFile}")
            }
            if (!generatedFile.exists()) {
                throw new GradleException("Generated OpenAPI spec is missing: ${generatedFile}")
            }
            diffJson.get().asFile.parentFile.mkdirs()
        }

        args(
                '--fail-on-incompatible',
                '--state',
                '--json', diffJson.get().asFile.absolutePath,
                baselineSpec.asFile.absolutePath,
                generatedSpec.get().asFile.absolutePath
        )
    }
}

tasks.register('verifyOpenApiContract') {
    group = 'verification'
    description = 'Verifies generated OpenAPI specs against committed baseline specs.'
    dependsOn verifyOpenApiContractTasks
}

tasks.register('verifyCurrentSystemInventory', Exec) {
    group = 'verification'
    description = 'Verifies the source-based API, schema, and scheduler inventory.'
    commandLine 'bash', 'scripts/verify-current-system-inventory.sh'
}

tasks.register('collectDevelopmentBootstrapManifest', Exec) {
    group = 'documentation'
    description = 'Collects the repeatable local development bootstrap manifest.'
    commandLine 'bash', 'scripts/collect-development-bootstrap-manifest.sh'
}

tasks.register('verifyDevelopmentBootstrap', Exec) {
    group = 'verification'
    description = 'Verifies local profile, dependency, seed, and inventory bootstrap contracts.'
    commandLine 'bash', 'scripts/verify-development-bootstrap.sh'
}
