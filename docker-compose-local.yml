#로컬용 컴포즈

name: pingdom-local

services:
  postgres:
    image: 'postgis/postgis:16-3.4'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB:-pingdom}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pingdom}'
      - 'POSTGRES_USER=${POSTGRES_USER:-pingdom}'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - './docker/postgres/initdb:/docker-entrypoint-initdb.d'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: 'redis:7.2-alpine'
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
