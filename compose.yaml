services:
  postgres:
    image: 'postgis/postgis:16-3.4'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - './docker/postgres/initdb:/docker-entrypoint-initdb.d'
